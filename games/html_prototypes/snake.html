<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Snake</title>
<style>
  body {
    margin: 0;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    background: #101828;
    color: #fff;
    font-family: system-ui, -apple-system, "Segoe UI", Roboto, Arial, sans-serif;
  }

  .panel {
    text-align: center;
  }

  canvas {
    background: #0b1220;
    border: 2px solid #334155;
    border-radius: 8px;
    display: block;
    margin: 12px auto;
  }

  .score {
    font-size: 1.2rem;
    margin: 8px 0;
  }

  .hint {
    color: #94a3b8;
    font-size: 0.9rem;
  }
</style>
</head>
<body>
  <div class="panel">
    <h1>Snake</h1>
    <div class="score">
      Score: <span id="score">0</span> | Best: <span id="best">0</span>
    </div>
    <canvas id="game" width="400" height="400"></canvas>
    <div class="hint">
      Arrow keys / WASD to move. P to pause. R to restart.
    </div>
  </div>

  <script>
    (() => {
      const canvas = document.getElementById("game");
      const ctx = canvas.getContext("2d");
      const scoreEl = document.getElementById("score");
      const bestEl = document.getElementById("best");

      const cols = 20;
      const rows = 20;
      const cell = canvas.width / cols;

      let snake;
      let dir;
      let nextDir;
      let food;
      let score;
      let best = 0;
      let speed;
      let running;
      let paused;
      let timeoutId;

      const keys = {
        ArrowUp: { x: 0, y: -1 },
        ArrowDown: { x: 0, y: 1 },
        ArrowLeft: { x: -1, y: 0 },
        ArrowRight: { x: 1, y: 0 },
        w: { x: 0, y: -1 },
        s: { x: 0, y: 1 },
        a: { x: -1, y: 0 },
        d: { x: 1, y: 0 }
      };

      function randomFood() {
        while (true) {
          const x = Math.floor(Math.random() * cols);
          const y = Math.floor(Math.random() * rows);

          if (!snake.some(part => part.x === x && part.y === y)) {
            return { x, y };
          }
        }
      }

      function reset() {
        snake = [
          { x: 10, y: 10 },
          { x: 9, y: 10 },
          { x: 8, y: 10 }
        ];

        dir = { x: 1, y: 0 };
        nextDir = { x: 1, y: 0 };
        score = 0;
        speed = 140;
        running = true;
        paused = false;

        food = randomFood();
        updateScore();

        clearTimeout(timeoutId);
        loop();
      }

      function updateScore() {
        scoreEl.textContent = score;
        best = Math.max(best, score);
        bestEl.textContent = best;
      }

      function isOpposite(a, b) {
        return a.x === -b.x && a.y === -b.y;
      }

      function step() {
        dir = nextDir;

        const head = {
          x: snake[0].x + dir.x,
          y: snake[0].y + dir.y
        };

        if (
          head.x < 0 ||
          head.x >= cols ||
          head.y < 0 ||
          head.y >= rows ||
          snake.some(part => part.x === head.x && part.y === head.y)
        ) {
          running = false;
          return;
        }

        snake.unshift(head);

        if (head.x === food.x && head.y === food.y) {
          score += 10;
          speed = Math.max(50, speed - 4);
          food = randomFood();
          updateScore();
        } else {
          snake.pop();
        }
      }

      function draw() {
        ctx.clearRect(0, 0, canvas.width, canvas.height);

        ctx.fillStyle = "#ef4444";
        ctx.beginPath();
        ctx.arc(
          food.x * cell + cell / 2,
          food.y * cell + cell / 2,
          cell / 2 - 2,
          0,
          Math.PI * 2
        );
        ctx.fill();

        snake.forEach((part, i) => {
          ctx.fillStyle = i === 0 ? "#22d3ee" : "#16a34a";
          ctx.fillRect(
            part.x * cell + 1,
            part.y * cell + 1,
            cell - 2,
            cell - 2
          );
        });

        if (!running || paused) {
          ctx.fillStyle = "rgba(0, 0, 0, 0.65)";
          ctx.fillRect(0, 0, canvas.width, canvas.height);

          ctx.fillStyle = "#fff";
          ctx.textAlign = "center";
          ctx.textBaseline = "middle";

          ctx.font = "bold 32px system-ui, sans-serif";
          ctx.fillText(
            running ? "Paused" : "Game Over",
            canvas.width / 2,
            canvas.height / 2 - 18
          );

          ctx.font = "18px system-ui, sans-serif";
          ctx.fillText(
            `Score: ${score}`,
            canvas.width / 2,
            canvas.height / 2 + 18
          );
        }
      }

      function loop() {
        if (!running) return;

        if (!paused) step();
        draw();

        if (running) {
          timeoutId = setTimeout(loop, paused ? 100 : speed);
        }
      }

      window.addEventListener("keydown", event => {
        const key = event.key.length === 1 ? event.key.toLowerCase() : event.key;
        const move = keys[key];

        if (move) {
          event.preventDefault();

          if (!running || paused) return;

          if (!isOpposite(move, nextDir)) {
            nextDir = move;
          }
        } else if (key === "p") {
          if (running) {
            paused = !paused;
            clearTimeout(timeoutId);
            loop();
          }
        } else if (key === "r") {
          reset();
        }
      });

      reset();
    })();
  </script>
</body>
</html>
